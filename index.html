<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Coco Clicker</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            text-align: center;
            background: #222;
            color: white;
        }

        h1 {
            margin-top: 40px;
        }

        #counter {
            font-size: 40px;
            margin: 20px;
        }

        #cookie {
            width: 300px;
            cursor: pointer;
            user-select: none;
            transition: transform 0.05s;
        }

        #cookie:active {
            transform: scale(0.95);
        }
    </style>
</head>

<body>

    <h1>Soco Cex Clicker!</h1>

    <div id="counter">Soco Cexes: 0</div>
    
    <img id="cookie" src="cookie.png">
    <audio id="clickSound" src="click.mp3"></audio>

    <button id="shopButton">🛒 Skin Shop</button>

<div id="shop" style="display: none;">
    <h2>Skin Shop</h2>

    <button class="skin" data-skin="cookie.png" data-price="0">
        🍪 Normal Cex — Free
    </button>

    <button class="skin" data-skin="goldcookie.png" data-price="100">
        🪙 Long Cex — 100 Cookies
    </button>

    <button class="skin" data-skin="chocolatecookie.png" data-price="500">
        🍫 Normal Saraza Zex — 500 Cookies
    </button>
</div>
    <script>
        let cookies = 0;

        const cookie = document.getElementById("cookie");
        const counter = document.getElementById("counter");

        cookie.addEventListener("click", function() {
            cookies++;
            counter.textContent = "Soco Cexes: " + cookies;
        });
    </script>
<script src="script.js"></script>
</body>
</html>
