<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Coco Clicker</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            text-align: center;
            background: #222;
            color: white;
        }

        h1 {
            margin-top: 40px;
        }

        #counter {
            font-size: 40px;
            margin: 20px;
        }

        #cookie {
            width: 300px;
            cursor: pointer;
            user-select: none;
            transition: transform 0.05s;
        }

        #cookie:active {
            transform: scale(0.95);
        }
    </style>
</head>

<body>

    <h1>Soco Cex Clicker!</h1>

    <div id="counter">Soco Cexes: 0</div>

    <img id="cookie" src="cookie.png">
    <audio id="clickSound" src="click.mp3"></audio>

    <script>
        let cookies = 0;

        const cookie = document.getElementById("cookie");
        const counter = document.getElementById("counter");

        cookie.addEventListener("click", function() {
            cookies++;
            counter.textContent = "Cocos: " + cookies;
        });
    </script>

</body>
</html>
